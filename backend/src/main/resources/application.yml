# Cấu hình đọc từ biến môi trường. Không có mật khẩu nào được ghi cứng ở đây.
spring:
  application:
    name: nexus-device-cloud
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexus_devicecloud}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${NEXUS_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${NEXUS_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${NEXUS_OPENAPI_ENABLED:true}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

nexus:
  cors:
    allowed-origins: ${NEXUS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${NEXUS_SEED_ENABLED:false}
    admin-email: ${NEXUS_SEED_ADMIN_EMAIL:admin@demo.local}
    admin-password: ${NEXUS_SEED_ADMIN_PASSWORD:}
