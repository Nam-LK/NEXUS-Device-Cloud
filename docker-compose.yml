# Giai đoạn đầu chỉ chạy PostgreSQL để tiết kiệm RAM. Backend và frontend chạy trực tiếp trên máy.
name: nexus-device-cloud

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_devicecloud}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong file .env (chạy scripts/setup.ps1)}
    ports:
      # Chỉ mở cho chính máy của bạn, không mở ra mạng LAN
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  nexus_postgres_data:
